name: onnx-linux-cpu

# Reproduces the ONNX deployment validation on a Linux runner (no GPU, no dataset
# needed): loads models/y8n_aug_onnx.onnx with onnxruntime CPU, runs one inference
# and a 50-run latency benchmark.

on:
  push:
    paths:
      - "models/*.onnx"
      - "scripts/onnx_infer.py"
      - "scripts/validate_linux.sh"
      - ".github/workflows/onnx-linux.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate ONNX inference on Linux
        env:
          PIP_INDEX: https://pypi.org/simple
        run: bash scripts/validate_linux.sh

      - name: Show benchmark result
        run: cat reports/onnx_bench_linux.json

      - uses: actions/upload-artifact@v4
        with:
          name: onnx-bench-linux
          path: |
            reports/onnx_bench_linux.json
            screenshots/onnx_infer_*.jpg
